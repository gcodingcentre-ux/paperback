<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – PaperBack Publishers</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=2">
<link rel="apple-touch-icon" href="/favicon-180.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#4F81D3;--bd:#1E3A6E;--bd2:#152b54;--green:#9AC44A;--gd:#4F7A12;--ink:#16233F;--muted:#5b6985;--sky:#EAF0FB;--line:#dde5f3;--red:#B3261E;--amber:#8a5a00;--bg:#f4f6fb;--card:#fff;--shadow:0 1px 2px #1e3a6e14,0 4px 14px #1e3a6e0d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;color:var(--bd)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid #4f81d366;outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;border:0;border-radius:9px;padding:.55rem 1rem;font-weight:600;color:#fff;background:var(--bd);transition:filter .15s,transform .05s;text-decoration:none}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.g{background:var(--gd)}.btn.r{background:var(--red)}.btn.o{background:#fff;color:var(--bd);border:1.5px solid var(--line)}.btn.o:hover{background:var(--sky);filter:none}
.btn.s{padding:.3rem .65rem;font-size:.85rem;border-radius:7px}
.btn.ghost{background:transparent;color:var(--bd);border:1.5px solid transparent}.btn.ghost:hover{background:var(--sky);filter:none}
input,select,textarea{font:inherit;width:100%;padding:.58rem .75rem;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #4f81d322}
input[type=checkbox]{width:auto;accent-color:var(--bd)}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.95rem}
label input,label select,label textarea{margin-top:.3rem;font-weight:400}
.help{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:.25rem}
.cnt{float:right;font-weight:400;font-size:.75rem;color:var(--muted)}
.err{color:var(--red);font-weight:600;min-height:1.4em;font-size:.9rem}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 20% 10%,#4F81D3 0,transparent 45%),linear-gradient(160deg,var(--bd2),var(--bd))}
.lbox{background:#fff;border-radius:18px;padding:2.2rem 2rem;width:100%;max-width:400px;box-shadow:0 24px 60px #0005}
.lbox .logo{width:54px;height:54px;border-radius:14px;object-fit:cover;margin-bottom:.8rem;border:1px solid var(--line)}
.lbox h1{font-size:1.8rem;margin-bottom:.2rem}.lbox p{color:var(--muted);margin:0 0 1.2rem}
.lbox .btn{width:100%;padding:.75rem}
.flink{background:0;border:0;color:var(--blue);text-decoration:underline;padding:0;margin-top:.9rem;font-weight:500}

/* shell */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--bd),var(--bd2));color:#fff;padding:1.1rem .8rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:.7rem;align-items:center;padding:.2rem .5rem 1.1rem}
.brand img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#fff}
.brand b{font:700 1.15rem Fraunces,serif;display:block;line-height:1.1}.brand small{color:#b9c8e8;font-size:.75rem}
.nav-h{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:#8fa6d6;padding:.9rem .7rem .3rem;font-weight:700}
.nav button{display:flex;justify-content:space-between;align-items:center;width:100%;background:0;border:0;color:#dbe6ff;text-align:left;padding:.5rem .7rem;border-radius:9px;font-weight:500;gap:.5rem}
.nav button:hover{background:#ffffff17}.nav button.on{background:var(--green);color:#10260a;font-weight:700}
.nav b{font-size:.72rem;background:#ffffff2b;border-radius:99px;padding:0 .5rem;min-width:1.5rem;text-align:center}
.nav button.on b{background:#10260a22}
.nav b.alert{background:#ffb02e;color:#3b2400}
.side-tools{margin-top:auto;padding-top:1rem;border-top:1px solid #ffffff2b;display:grid;gap:.4rem}
.side-tools .btn{background:#ffffff17;font-weight:500;justify-content:flex-start;font-size:.88rem;padding:.45rem .7rem}
main{padding:0 clamp(1rem,3vw,2.5rem) 3rem;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:#f4f6fbee;backdrop-filter:blur(8px);display:flex;gap:.8rem;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid var(--line);margin-bottom:1.3rem}
.menu-btn{display:none}
.status{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:600;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--green)}
.status.busy i{background:#e9a400;animation:pulse 1s infinite}.status.bad i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
.top-r{display:flex;gap:.6rem;align-items:center}
.head{display:flex;flex-wrap:wrap;gap:.8rem;align-items:flex-end;justify-content:space-between;margin-bottom:.4rem}
.head h2{font-size:1.9rem;line-height:1.2}
.hint{color:var(--muted);margin:.2rem 0 1.2rem;max-width:80ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card.pad{padding:1.2rem 1.3rem}
.tbl{overflow:auto}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.tools input[type=search]{max-width:300px}.tools select{width:auto}
.tools .sp{flex:1}
.seg{display:inline-flex;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:0;padding:.3rem .8rem;border-radius:8px;font-weight:600;color:var(--muted);font-size:.86rem}
.seg button.on{background:var(--bd);color:#fff}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8faff}
th{background:var(--sky);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--bd);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{background:#dde8fa}
th .ar{opacity:.6}
td.act{white-space:nowrap;text-align:right}td.act .btn{margin-left:.2rem}
td.ck,th.ck{width:36px;padding-right:0}
td .cl{max-width:380px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
td img.th{width:38px;aspect-ratio:2/3;object-fit:cover;border-radius:5px;border:1px solid var(--line);display:block}
td .swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:.4rem;vertical-align:-1px}
.pill{display:inline-block;padding:.1rem .65rem;border-radius:99px;background:var(--sky);color:var(--bd);font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.ok{background:#e4f2cc;color:var(--gd)}.pill.wait{background:#fff0c9;color:var(--amber)}.pill.off{background:#eceff5;color:#6b7690}.pill.bad{background:#fde2df;color:var(--red)}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.bulk{display:flex;gap:.6rem;align-items:center;background:var(--bd);color:#fff;padding:.5rem .9rem;border-radius:10px;margin-bottom:.8rem;font-weight:600}
.bulk .btn{background:#ffffff22}.bulk .btn.r{background:var(--red)}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin-bottom:1.2rem}
.stat{padding:1rem 1.1rem;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;box-shadow:var(--shadow);display:block;width:100%}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 18px #1e3a6e1c}
.stat span{display:block;color:var(--muted);font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{font:700 2rem Fraunces,serif;color:var(--bd);line-height:1.2}
.stat.warn b{color:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem}
.card h3{font-size:1.15rem;margin-bottom:.7rem}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:.1rem}
.chk li{display:flex;gap:.7rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.chk li:last-child{border:0}
.chk .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.chk .good .ic{background:#e4f2cc;color:var(--gd)}.chk .warn .ic{background:#fff0c9;color:var(--amber)}
.chk li span{flex:1}
.qa{display:flex;flex-wrap:wrap;gap:.5rem}
.rec{padding:.6rem 0;border-bottom:1px solid var(--line)}.rec:last-child{border:0}
.rec small{color:var(--muted)}

/* forms for site text / contact */
.fgroup{margin-bottom:1.1rem}
.fgroup h3{font-size:1.15rem;margin-bottom:.2rem}
.fgroup>p{margin:0 0 1rem;color:var(--muted);font-size:.9rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 1.2rem}
.fgrid .wide{grid-column:1/-1}
.savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:.8rem 1.2rem;display:flex;gap:.7rem;justify-content:flex-end;align-items:center;margin:0 -1.3rem -1.2rem;border-radius:0 0 14px 14px}
.savebar span{margin-right:auto;color:var(--muted);font-size:.88rem}

/* modal */
#modal,#pwm{position:fixed;inset:0;background:#0a1530a8;display:grid;place-items:center;padding:1rem;z-index:30}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:92vh;overflow:auto;padding:1.5rem;box-shadow:0 30px 70px #0006}
.mbox h3{font-size:1.4rem;margin-bottom:1rem}
.mbox .fgrid{grid-template-columns:1fr 1fr}.mbox .fgrid .wide{grid-column:1/-1}
.row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.5rem}
#toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.65rem 1.2rem;border-radius:10px;z-index:50;font-weight:600;box-shadow:0 8px 24px #0004;max-width:92vw}
#toast.bad{background:var(--red)}
.imgbox{display:flex;gap:.9rem;align-items:flex-start;margin-top:.3rem;font-weight:400}
.imgbox img{width:90px;aspect-ratio:2/3;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:var(--sky);flex:none}
.imgbox .noimg{width:90px;aspect-ratio:2/3;border-radius:7px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem;text-align:center;flex:none}
.imgbox small{display:block;color:var(--muted);margin:.4rem 0;font-weight:400}
.imgbox input[type=file]{padding:.4rem}
.lbl{font-weight:600;font-size:.88rem;margin-bottom:.95rem}

@media(max-width:900px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;z-index:25;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .2s}
 body.nav-open aside{transform:none;box-shadow:12px 0 40px #0006}
 .menu-btn{display:inline-flex}
 .mbox .fgrid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="lf">
    <img class="logo" src="/assets/logo.jpg" alt="">
    <h1>PaperBack Admin</h1>
    <p>Sign in to manage your website.</p>
    <label>Login ID<input id="u" autocomplete="username" autofocus></label>
    <label>Password<input id="p" type="password" autocomplete="current-password"></label>
    <div class="err" id="le" aria-live="polite"></div>
    <button class="btn" type="submit">Log in</button>
    <button class="flink" type="button" id="fp">Forgot password?</button>
  </form>
  <form class="lbox" id="rf" hidden>
    <h1>Reset password</h1>
    <p>Enter the recovery key (set as <b>ADMIN_RECOVERY_KEY</b> in your Vercel project settings) and choose a new password.</p>
    <label>Recovery key<input id="rk" type="password" autocomplete="off"></label>
    <label>New password (8+ characters)<input id="rn" type="password" autocomplete="new-password"></label>
    <label>Repeat new password<input id="rn2" type="password" autocomplete="new-password"></label>
    <div class="err" id="re" aria-live="polite"></div>
    <button class="btn" type="submit">Set new password</button>
    <button class="flink" type="button" id="rb">Back to login</button>
  </form>
</section>

<div id="app" hidden>
  <aside>
    <div class="brand"><img src="/assets/logo.jpg" alt=""><div><b>PaperBack</b><small>Website dashboard</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="side-tools">
      <button class="btn" id="dl">⬇ Download site-content.js</button>
      <button class="btn" id="ex">⤓ Export JSON backup</button>
      <button class="btn" id="im">⤒ Import JSON</button>
      <button class="btn" id="rs">↺ Reset to defaults</button>
      <button class="btn" id="cp">🔑 Change password</button>
      <button class="btn" id="lo">⎋ Log out</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="top-r"><button class="btn o s menu-btn" id="menu" aria-label="Open menu">☰ Menu</button><span class="status" id="st"><i></i><span>All changes saved</span></span></div>
      <div class="top-r"><a class="btn o s" href="/" target="_blank" rel="noopener">View live site ↗</a></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modal" hidden><form class="mbox" id="mf"><h3 id="mt"></h3><div class="fgrid" id="mfields"></div><div class="row"><button type="button" class="btn o" id="mc">Cancel</button><button class="btn g" type="submit">Save</button></div></form></div>
<div id="pwm" hidden><form class="mbox" id="pf" style="max-width:420px"><h3>Change password</h3>
  <label>Current password<input id="pc" type="password" autocomplete="current-password"></label>
  <label>New password (8+ characters)<input id="pn" type="password" autocomplete="new-password"></label>
  <label>Repeat new password<input id="pn2" type="password" autocomplete="new-password"></label>
  <div class="err" id="pe" aria-live="polite"></div>
  <div class="row"><button type="button" class="btn o" id="pcx">Cancel</button><button class="btn g" type="submit">Change password</button></div></form></div>
<div id="toast" hidden></div>

<script>
/* ===== Login is checked on the server (/api/auth). The token is kept for this tab only. ===== */
const SESS="pb_admin_token";
const token=()=>sessionStorage.getItem(SESS)||"";

 books:{label:"Books",single:"book",hint:"The catalogue and each book's landing page. Set “New release” to Yes to show it under New releases. A price enables ordering and coupons on the book page.",cols:["image","title","author","genre","price","isNew"],

/* Settings rows (label → value) used by Site text and Contact & social */
const getS=l=>{const r=DB.settings.find(x=>String(x.label).trim().toLowerCase()===l.toLowerCase());return r?String(r.value||""):""};
function setS(l,v){
  v=String(v||"").trim();
  const i=DB.settings.findIndex(x=>String(x.label).trim().toLowerCase()===l.toLowerCase());
  if(!v){if(i>-1)DB.settings.splice(i,1);return}
  if(i>-1)DB.settings[i].value=v;else DB.settings.push({id:uid(),label:l,value:v});
}

/* ===== Saving: every change is sent to the server (Redis). Saves run one after another so they never overwrite each other. ===== */
let saveChain=Promise.resolve(), lastGood="", pendingSaves=0;
function persist(){
  const snap=JSON.stringify(DB), body='{"content":'+snap+'}';
  pendingSaves++;setStatus("busy","Saving…");
  saveChain=saveChain
    .then(()=>fetch("/api/save-content",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token()},body}))
    .then(async r=>{
      if(r.status===401){toast("Session expired. Please log in again.",4000,1);setTimeout(logout,1500);return false}
      if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||("Error "+r.status))}
      lastGood=snap;toast("Saved to website ✓");return true;
    })
    .catch(e=>{
      // The server refused this change: undo it here too, so one bad entry cannot block every later save.
      if(lastGood){DB=JSON.parse(lastGood);render()}
      toast("NOT saved (change undone): "+e.message,6000,1);return false})
    .then(ok=>{pendingSaves--;if(!pendingSaves)setStatus(ok?"":"bad",ok?"All changes saved":"Last save failed");return ok});
  return saveChain;
}
addEventListener("beforeunload",e=>{if(pendingSaves>0){e.preventDefault();e.returnValue=""}});

/* visitor feedback waiting on the server -> shown in the Reader feedback list as "pending" */
function mergePending(pending){
  let added=false;
  (Array.isArray(pending)?pending:[]).forEach(f=>{
    if(f&&f.id&&!DB.feedback.some(x=>x.id===f.id)){DB.feedback.unshift({id:f.id,name:f.name,rating:String(f.rating),date:f.date,message:f.message,status:"pending"});added=true}
  });
  return added;
}

}

function health(){
  const B=DB.books,items=[];
  const add=(ok,txt,go,btn)=>items.push({ok,txt,go,btn});
  const pend=pendingCount();
  add(pend===0,pend?`${pend} reader feedback message${pend>1?"s":""} waiting for approval`:"No feedback waiting for approval","feedback","Review");
  const nc=B.filter(b=>!b.image).length;
  add(nc===0,nc?`${nc} book${nc>1?"s":""} without a cover image (a coloured cover is shown)`:"Every book has a cover image","books","Fix");
  const np=B.filter(b=>!(Number(b.price)>0)).length;
  add(np===0,np?`${np} book${np>1?"s":""} without a price (ordering needs a price)`:"Every book has a price","books","Fix");
  const ns=B.filter(b=>!String(b.summary||"").trim()).length;
  add(ns===0,ns?`${ns} book${ns>1?"s":""} without a summary on the book page`:"Every book has a summary","books","Fix");
  const ex=DB.coupons.filter(c=>couponState(c)==="expired").length;
  add(ex===0,ex?`${ex} expired coupon${ex>1?"s":""} still listed`:"No expired coupons","coupons","Tidy");
  const dup=new Set(),d=[];B.forEach(b=>{const s=slug(b.title);if(dup.has(s))d.push(b.title);dup.add(s)});
  add(d.length===0,d.length?`Two books share the same title: ${d.join(", ")}`:"All book titles are unique","books","Fix");
  const ne=DB.authors.filter(x=>!String(x.email||"").trim()).length;
  add(ne===0,ne?`${ne} author${ne>1?"s have":" has"} no email, so they cannot be notified of orders`:"Every author has an email for order notifications","authors","Fix");
  const phone=getS("Phone"),mail=getS("Email");
  add(!!(phone&&mail),(phone&&mail)?"Contact details are filled in":"Phone or email is missing","settings","Open");
  return items;
}

const lab=(s,n)=>n==="state"?"Status":s.f.find(f=>f[0]===n)[1].replace(/ \(.*\)$/,"");
function cell(name,v,r){
  if(name==="image")return v?`<img class="th" src="${esc(v)}" alt="" loading="lazy">`:"—";
  if(name==="status")return `<span class="pill ${v==="approved"?"ok":"wait"}">${esc(v)}</span>`;
  if(name==="state"){const st=couponState(r);return `<span class="pill ${st==="live"?"ok":st==="off"?"off":"bad"}">${st==="live"?"Live":st==="off"?"Off":"Expired"}</span>`}
  if(name==="show")return v==="Yes"?`<span class="pill ok">On site</span>`:`<span class="pill off">Private</span>`;
  if(name==="email")return v?esc(v):`<span class="pill wait">No email</span>`;
  if(name==="isNew")return v==="Yes"?`<span class="pill ok">New</span>`:"";
  if(name==="rating"){const n=Math.min(5,Math.max(0,parseInt(v,10)||0));return `<span style="color:var(--amber);white-space:nowrap">${"★".repeat(n)+"☆".repeat(5-n)}</span>`}
  if(name==="color")return `<span class="swatch" style="background:${SWATCH[v]||"#ccc"}"></span>${esc(v)}`;
  if(name==="price")return Number(v)>0?"₹"+Number(v).toLocaleString("en-IN"):`<span style="color:var(--muted)">—</span>`;
  if(name==="type"&&cur==="coupons")return v==="flat"?"₹ off":"% off";
  if(name==="value"&&cur==="coupons")return r.type==="flat"?"₹"+esc(v):esc(v)+"%";
  if(name==="expires"||name==="date")return v?esc(v):`<span style="color:var(--muted)">—</span>`;
  return `<div class="cl">${esc(v)}</div>`;
}
function rowsNow(){
  const q=UI.q.toLowerCase(),f=UI.filter;
  let rows=DB[cur].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
  if(f){
    if(cur==="books")rows=rows.filter(r=>f==="__new"?r.isNew==="Yes":f==="__nocover"?!r.image:f==="__noprice"?!(Number(r.price)>0):r.genre===f);
    else if(cur==="authors")rows=rows.filter(r=>r.genre===f);
    else if(cur==="coupons")rows=rows.filter(r=>f==="__show"?r.show==="Yes":couponState(r)===f);
    else if(cur==="feedback")rows=rows.filter(r=>r.status===f);
  }
  if(UI.sort){
    const k=UI.sort,num=["price","value","rating"].includes(k);
    rows=[...rows].sort((a,b)=>{const x=k==="state"?couponState(a):a[k],y=k==="state"?couponState(b):b[k];return (num?(Number(x)||0)-(Number(y)||0):String(x??"").localeCompare(String(y??""),undefined,{sensitivity:"base"}))*UI.dir});
  }
  return rows;
}

  const s=SEG[cur];if(!s||!$("tb"))return;

   ${cur==="feedback"&&r.status==="pending"?`<button class="btn g s" data-a="ok" data-id="${r.id}">Approve</button>`:""}
   ${canMove?`<button class="btn o s" data-a="up" data-id="${r.id}" title="Move up">↑</button><button class="btn o s" data-a="dn" data-id="${r.id}" title="Move down">↓</button>`:""}
   <button class="btn s" data-a="ed" data-id="${r.id}">Edit</button>${cur==="feedback"?"":`<button class="btn o s" data-a="dup" data-id="${r.id}" title="Duplicate">⧉</button>`}<button class="btn r s" data-a="del" data-id="${r.id}">Delete</button></td></tr>`).join("");
  $("em").hidden=rows.length>0;$("em").textContent=(UI.q||UI.filter)?"No matches.":"Nothing here yet. Click “Add”.";
  $("count").textContent=rows.length+(rows.length!==DB[cur].length?" of "+DB[cur].length:"")+" shown"+(canMove?"":" · reordering off while searching, filtering or sorting");
  const all=$("all");if(all){all.checked=rows.length>0&&rows.every(r=>UI.sel.has(r.id));all.onchange=()=>{rows.forEach(r=>all.checked?UI.sel.add(r.id):UI.sel.delete(r.id));renderList()}}

function bulkBar(){

/* ===== Cover images: convert to WebP in the browser, upload the small file ===== */
let fresh=null, originalImg="";   // fresh = image uploaded in this open form but not saved yet
function delImg(u){const m=/id=([a-f0-9]{16})$/.exec(u||"");if(!m)return;fetch("/api/upload-image?id="+m[1],{method:"DELETE",headers:{Authorization:"Bearer "+token()}}).catch(()=>{})}
const blobOf=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
const dataUrl=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>no(new Error("Could not read the image."));f.readAsDataURL(b)});
async function toSmallImage(file){
  if(!/^image\/(png|jpe?g|webp)$/.test(file.type))throw new Error("Please choose a JPG, PNG or WebP picture.");
  if(file.size>15*1024*1024)throw new Error("That picture is larger than 15 MB.");
  let bmp;
  try{bmp=await createImageBitmap(file)}   // also applies the phone-camera rotation
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("Could not read that picture."));i.src=URL.createObjectURL(file)})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  if(!w0||!h0)throw new Error("Could not read that picture.");
  let scale=Math.min(1,600/w0,900/h0), q=0.82, blob, tries=0;
  const LIMIT=80*1024;
  do{
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w0*scale));c.height=Math.max(1,Math.round(h0*scale));
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality="high";x.drawImage(bmp,0,0,c.width,c.height);
    blob=await blobOf(c,"image/webp",q);
    if(!blob||blob.type!=="image/webp")blob=await blobOf(c,"image/jpeg",q);   // very old browsers cannot write WebP
    if(!blob)throw new Error("Could not convert that picture.");
    if(blob.size<=LIMIT)break;
    if(q>0.5)q-=0.1;else scale*=0.8;
  }while(++tries<8);
  if(blob.size>190*1024)throw new Error("Could not make this picture small enough. Try a smaller one.");
  return blob;
}
async function onPickImage(e){
  const file=e.target.files[0];if(!file)return;
  const info=$("imginfo"),save=$("mf").querySelector("button[type=submit]");
  info.textContent="Converting…";save.disabled=true;
  try{
    const blob=await toSmallImage(file);
    info.textContent="Uploading…";
    const r=await fetch("/api/upload-image",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token()},body:JSON.stringify({data:await dataUrl(blob)})});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){toast("Session expired. Please log in again.",4000,1);setTimeout(logout,1500);return}
    if(!r.ok||!d.url)throw new Error(d.error||("Upload failed ("+r.status+")"));
    if(fresh)delImg(fresh);               // replaced a picture uploaded earlier in this same form
    fresh=d.url;
    document.querySelector('#mfields input[name="image"]').value=d.url;
    $("imgslot").innerHTML=`<img id="imgprev" src="${URL.createObjectURL(blob)}" alt="New cover">`;
    $("imgclear").hidden=false;
    const kb=n=>(n/1024).toFixed(n<10240?1:0)+" KB";
    info.textContent="Ready: "+kb(file.size)+" → "+kb(blob.size)+(blob.type==="image/webp"?" WebP":" JPEG")+". Click Save to use it.";
  }catch(err){info.textContent=err.message;e.target.value=""}
  finally{save.disabled=false}
}

  DB={};for(const k in SEG)DB[k]=saved&&Array.isArray(saved[k])?saved[k]:(saved&&k!=="coupons"?[]:seed[k]);

});
$("lo").onclick=logout;

/* ===== Change password (logged in) and Forgot password (recovery key) ===== */
function postPw(payload,auth){
  return fetch("/api/password",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},auth?{Authorization:"Bearer "+token()}:{}),body:JSON.stringify(payload)})
    .then(async r=>({r,d:await r.json().catch(()=>({}))}));
}
$("cp").onclick=()=>{$("pf").reset();$("pe").textContent="";$("pwm").hidden=false;$("pc").focus()};
$("pcx").onclick=()=>{$("pwm").hidden=true};
$("pf").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("pe");err.textContent="";
  if($("pn").value.length<8){err.textContent="The new password must be at least 8 characters.";return}
  if($("pn").value!==$("pn2").value){err.textContent="The two new passwords do not match.";return}
  const btn=$("pf").querySelector("button[type=submit]");btn.disabled=true;
  try{
    const {r,d}=await postPw({action:"change",current:$("pc").value,next:$("pn").value},true);
    if(r.status===401){$("pwm").hidden=true;toast("Session expired. Please log in again.",4000,1);setTimeout(logout,1500);return}
    if(!r.ok){err.textContent=d.error||("Error "+r.status);return}
    $("pwm").hidden=true;$("pf").reset();toast("Password changed ✓",3500);
  }catch(x){err.textContent="Could not reach the server."}
  finally{btn.disabled=false}
});
$("fp").onclick=()=>{$("lf").hidden=true;$("rf").hidden=false;$("rk").focus()};
$("rb").onclick=()=>{$("rf").hidden=true;$("lf").hidden=false;$("re").textContent=""};
$("rf").addEventListener("submit",async e=>{
  e.preventDefault();const err=$("re");err.textContent="";
  if(!$("rk").value){err.textContent="Enter the recovery key.";return}
  if($("rn").value.length<8){err.textContent="The new password must be at least 8 characters.";return}
  if($("rn").value!==$("rn2").value){err.textContent="The two new passwords do not match.";return}
  const btn=$("rf").querySelector("button[type=submit]");btn.disabled=true;
  try{
    const {r,d}=await postPw({action:"reset",key:$("rk").value,next:$("rn").value},false);
    if(!r.ok){err.textContent=d.error||("Error "+r.status);return}
    $("rf").reset();$("rb").onclick();$("le").textContent="Password changed. Log in with your new password.";
  }catch(x){err.textContent="Could not reach the server."}
  finally{btn.disabled=false}
});
if(token())enter();
</script>
